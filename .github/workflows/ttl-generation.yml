name: Typed TTL generations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttl-generations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      BASELINE: 8092601fd19d816cb0cef229c04571047b6cf9c5
      CANDIDATE_MODE: adopted
      CANDIDATE_DESIGN: atomic-cells-one-lookup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c013e4b87458da53950c7b530726d29f035bfe35
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Freeze source and typed-generation candidate
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/generation-evidence"
          mkdir -p "$E"
          git rev-parse HEAD HEAD^{tree} > "$E/source.txt"
          git archive --format=tar.gz HEAD > "$E/source.tar.gz"
          git archive --format=tar.gz "$BASELINE" > "$E/baseline-source.tar.gz"
          printf 'baseline=%s\nmode=%s\ndesign=%s\n' "$BASELINE" "$CANDIDATE_MODE" "$CANDIDATE_DESIGN" > "$E/campaign.txt"
          go version > "$E/toolchain.txt"
          go env -json GOARCH GOOS GOEXPERIMENT CGO_ENABLED GOAMD64 > "$E/compiler-env.json"
          cp go.mod go.sum "$E/"
          go mod download
          go mod verify > "$E/module-verify.txt"
          test -z "$(gofmt -l ttl_lookup_generation*test.go)"
          python3 -m unittest discover -s tests/e2eperf -p 'test_*.py' -v > "$E/python-tests.txt" 2>&1
          for side in baseline candidate; do
            T="$RUNNER_TEMP/generation-$side"
            ref="$BASELINE"; if [ "$side" = candidate ]; then ref=HEAD; fi
            git worktree add --detach "$T" "$ref"
            cmp go.mod "$T/go.mod"; cmp go.sum "$T/go.sum"
            cp ttl_lookup_generation*test.go "$T/"
            cp tests/e2eperf/*.go "$T/tests/e2eperf/"
            if [ "$side" = candidate ] && [ "$CANDIDATE_MODE" = isolated ]; then
              python3 tests/e2eperf/ttl_generation_experiment.py --source "$T"
              gofmt -w "$T/set.go" "$T/ttl_generation.go" "$T/ttl_lookup_test.go" "$T/reliability_test.go"
              (cd "$T" && git add -N ttl_generation.go)
            fi
            (cd "$T" && git diff -- set.go ttl_generation.go ttl_lookup_test.go reliability_test.go > "$E/$side.patch" && go build -mod=readonly -trimpath -o "$E/worker-$side" ./tests/e2eperf && go test -mod=readonly -trimpath -c -o "$E/bench-$side" .)
            go version -m "$E/worker-$side" > "$E/build-$side.txt"
          done
          if [ "$CANDIDATE_MODE" = adopted ]; then test ! -s "$E/candidate.patch"; else test -s "$E/candidate.patch"; fi
          python3 - <<'PYCODE' > "$E/adopted-source-check.json"
          import json, os, pathlib, sys
          sys.path.insert(0, 'tests/e2eperf')
          from ttl_generation_experiment import transform
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          before,after=root/'generation-baseline',root/'generation-candidate'
          assert (after/'set.go').read_text()==transform((before/'set.go').read_text())
          assert (after/'ttl_generation.go').read_bytes()==pathlib.Path('tests/e2eperf/ttl_generation_candidate.go.txt').read_bytes()
          for name,n in (('ttl_lookup_test.go',3),('reliability_test.go',1)):
              text=(before/name).read_text(); old='ng: &sync.Map{}, og: &sync.Map{}'
              assert text.count(old)==n
              assert (after/name).read_text()==text.replace(old,'ng: newTTLGeneration(), og: newTTLGeneration()')
          paths={str(p.relative_to(after)) for p in after.rglob('*.go')}
          assert paths-{'ttl_generation.go'}=={str(p.relative_to(before)) for p in before.rglob('*.go')}
          changed={'set.go','ttl_generation.go','ttl_lookup_test.go','reliability_test.go'}
          for name in paths-changed:
              assert (after/name).read_bytes()==(before/name).read_bytes(), name
          print(json.dumps({'design':'atomic-cells-one-lookup','allowed_changed':sorted(changed),'go_files':len(paths)},indent=2))
          PYCODE
      - name: Public baseline contracts and candidate race expiration checks
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/generation-evidence"
          (cd "$RUNNER_TEMP/generation-baseline" && go test -mod=readonly -count=1 -json -run '^TestTTLGenerationPublic' . > "$E/baseline-public.jsonl")
          cd "$RUNNER_TEMP/generation-candidate"
          go vet -mod=readonly ./... > "$E/vet.txt" 2>&1
          go test -mod=readonly -count=1 -json ./... > "$E/full.jsonl"
          go test -mod=readonly -race -shuffle=on -count=3 -json ./... > "$E/race.jsonl"
          python3 "$GITHUB_WORKSPACE/tests/e2eperf/ttl_generation_experiment.py" --source . --negative "$E/negative" > "$E/negative.json"
          git diff --exit-code -- go.mod go.sum
      - name: Same-work membership refresh contention and real-file recovery
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/generation-evidence"
          for suite in membership generation generation-cold ack-replay; do
            python3 tests/e2eperf/bench_pairs.py --baseline "$E/bench-baseline" --candidate "$E/bench-candidate" --suite "$suite" --pairs 5 --iterations 64 --out "$E/public-$suite" > "$E/public-$suite.json"
            python3 tests/e2eperf/bench_pairs.py --baseline "$E/bench-candidate" --candidate "$E/bench-candidate" --suite "$suite" --pairs 5 --iterations 64 --out "$E/aa-$suite" > "$E/aa-$suite.json"
          done
      - name: Durable lifecycle allocation and latency guardrails
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/generation-evidence"
          printf '%s\n' '[{"name":"same-small","count":512,"payload":256,"writers":8,"ack_percent":50,"scans":0},{"name":"same-dense","count":2048,"payload":256,"writers":8,"ack_percent":100,"scans":0}]' > "$E/aa-cases.json"
          python3 tests/e2eperf/observe.py --out "$E/host-before" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-candidate" --candidate "$E/worker-candidate" --cases "$E/aa-cases.json" --pairs 5 --out "$E/aa-before"
          python3 tests/e2eperf/observe.py --out "$E/host-paired" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-baseline" --candidate "$E/worker-candidate" --cases tests/e2eperf/ttl_generation_cases.json --pairs 5 --out "$E/paired"
          python3 tests/e2eperf/observe.py --out "$E/host-after" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-candidate" --candidate "$E/worker-candidate" --cases "$E/aa-cases.json" --pairs 5 --out "$E/aa-after"
          python3 tests/e2eperf/qualify.py --before "$E/aa-before/report.json" --after "$E/aa-after/report.json" > "$E/timing-qualification.json"
      - name: Separate fixed-work CPU allocation heap and trace diagnostics
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/generation-evidence"
          for side in baseline candidate; do
            "$E/bench-$side" -test.run='^$' -test.bench='^BenchmarkPublicACKReplay/all-acked$' -test.benchtime=512x -test.cpuprofile="$E/$side-replay.pprof" -test.memprofile="$E/$side-alloc.pprof" > "$E/$side-profile.log"
            go tool pprof -top -nodecount=30 -tagfocus=phase=public-ack-replay "$E/bench-$side" "$E/$side-replay.pprof" > "$E/$side-replay-cpu.txt"
            go tool pprof -top -sample_index=alloc_space "$E/bench-$side" "$E/$side-alloc.pprof" > "$E/$side-alloc.txt"
            python3 tests/e2eperf/run.py --binary "$E/worker-$side" --out "$E/$side-trace" --count 2048 --payload 256 --writers 16 --ack-percent 50 --scans 0 --diagnostics trace > "$E/$side-trace.log"
            go tool trace -pprof=sync "$E/$side-trace/transfer/trace.out" > "$E/$side-transfer-sync.pprof"
          done
      - name: Hash every observation including failures
        if: always()
        shell: bash
        run: |
          E="$RUNNER_TEMP/generation-evidence"
          mkdir -p "$E"; cd "$E"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Recompute every comparison from raw evidence
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/generation-evidence"
          for suite in membership generation generation-cold ack-replay; do
            python3 tests/e2eperf/bench_pairs.py --verify "$E/public-$suite" > /dev/null
            python3 tests/e2eperf/bench_pairs.py --verify "$E/aa-$suite" > /dev/null
          done
          python3 tests/e2eperf/verify.py --root "$E" --campaign paired=worker-baseline,worker-candidate --campaign aa-before=worker-candidate,worker-candidate --campaign aa-after=worker-candidate,worker-candidate > "$RUNNER_TEMP/generation-verified.json"
          cat "$RUNNER_TEMP/generation-verified.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ttl-generations-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/generation-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
