name: Publish prepared journal review

on:
  push:
    branches: [chore/publish-journal-review-20260923]
    paths: [.github/workflows/publish-prepared-review.yml]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Laisky/go-journal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the exact prepared transfer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: transfer
          persist-credentials: false
      - name: Open only the publication branch checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c488077f45aac09b14a9d42769419b60e8ca2e01
          fetch-depth: 0
          path: repo
      - name: Verify original bytes, apply all sixteen changes and verify the complete source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join((Path('transfer/.prepared-review') / f'{i:02}.b64').read_text().strip() for i in range(1, 6))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'ece63a9e3748f70fb2b1846864e1cd0fb94fad6603b3c714ad9dd46e4fb6fd70', 'compressed patch checksum mismatch'
          data = lzma.decompress(compressed)
          assert hashlib.sha256(data).hexdigest() == 'dc9a44213744e83c392b3a201c00e33b20d2c522dbee5e98fe217e5b3dbb23b2', 'original patch checksum mismatch'
          assert data.count(b'\nSubject: [PATCH ') == 16, 'unexpected patch count'
          Path('/tmp/prepared-journal.mbox').write_bytes(data)
          PY
          cd repo
          git config user.name 'Journal review publisher'
          git config user.email 'noreply@github.com'
          git switch -c fix/journal-user-behavior-20260923
          # The final read-only workflow was installed through the connector.
          # Preserve it unchanged while applying the original sixteen source changes.
          git am --exclude=.github/workflows/behavior.yml /tmp/prepared-journal.mbox
          test "$(git rev-list --count c488077f45aac09b14a9d42769419b60e8ca2e01..HEAD)" = 16
          test "$(git rev-parse HEAD^{tree})" = c6f5ce52ce7bb98f082876ac708f3af6ee338f69
          git diff --exit-code c488077f45aac09b14a9d42769419b60e8ca2e01..HEAD -- .github/workflows go.mod go.sum
          git log --oneline -17
      - name: Push without force and without overwriting concurrent changes
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          observed=$(git ls-remote origin refs/heads/fix/journal-user-behavior-20260923 | cut -f1)
          test "$observed" = c488077f45aac09b14a9d42769419b60e8ca2e01
          git push origin HEAD:refs/heads/fix/journal-user-behavior-20260923
          printf 'Published commit: %s\nVerified source tree: %s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
