name: Journal adaptive read-ahead iteration
on:
  push:
    branches: [perf/measured-journal-20260923]
    paths: [.github/workflows/perf-adaptive.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Run large-record and failure controls before revising buffer selection
        run: go test -mod=readonly -count=1 -run TestPerformanceContract ./...
      - name: Preserve large plain-file read-ahead while bounding small readers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('serialize.go');s=p.read_text()
          old='decoder.reader = msgp.NewReaderSize(fp, readBufferSize)';assert s.count(old)==1
          s=s.replace(old,'''// Large uncompressed scans benefit from the original read-ahead size.
          \t\t// Keep small segments bounded; never use file size as a record limit.
          \t\tsize := readBufferSize
          \t\tif info, statErr := fp.Stat(); statErr == nil && info.Mode().IsRegular() && info.Size() >= int64(BufSize) {
          \t\t\tsize = BufSize
          \t\t}
          \t\tdecoder.reader = msgp.NewReaderSize(fp, size)''')
          p.write_text(s)
          p=Path('PERFORMANCE.md');s=p.read_text()
          s += '''
          ## Measured correction: adaptive plain-data read-ahead

          The first hosted paired campaign (application Actions run 35858164130)
          exposed a repeatable 14.7% slowdown for the 4,096-record uncompressed
          recovery scan: 6.921 ms baseline versus 7.937 ms with fixed 64 KiB data
          read-ahead, with non-overlapping observed ranges. That fixed-size policy
          is superseded, not presented as a universal improvement.

          Uncompressed regular data files at least 4 MiB now retain the original
          4 MiB read-ahead. Smaller data files, compressed decoding and ID decoding
          retain 64 KiB lookahead. The file stat is a buffer-size hint only; stat
          failure does not hide the decoder's existing errors, and file size is
          never a limit on accepted records or a substitute for decoding.

          An alternating five-pair local comparison reduced the large plain scan
          from 9.733 ms to 7.142 ms while the 64-record scan was essentially
          unchanged (201 versus 202 microseconds). The final application campaign
          reruns every workload and the whole durable pipeline with the corrected
          policy. Its raw results include the rejected fixed-size candidate so
          the unfavorable evidence is retained.
          '''
          p.write_text(s)
          PY
          gofmt -w serialize.go
      - name: Verify all persistence and recovery contracts without changing modules
        run: |
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s ./...
          git diff --exit-code -- go.mod go.sum
      - name: Push the validated regression correction
        run: |
          git config user.name Laisky
          git config user.email public@laisky.com
          git add serialize.go PERFORMANCE.md
          git commit -m 'perf(journal): retain large-file read-ahead after paired regression measurements'
          git push origin HEAD:refs/heads/perf/measured-journal-20260923
