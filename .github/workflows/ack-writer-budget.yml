name: ACK writer budget
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ack-writer-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      BASELINE: 7a754e0786bf1de591f3c7cdee69ea5a8db04385
      CANDIDATE_MODE: isolated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7d9eb2c95cbdefe7f01d3c9a4a5469cf62508d5e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Freeze source and isolate ACK-only allocation change
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/ack-budget-evidence"
          mkdir -p "$E"
          git rev-parse HEAD HEAD^{tree} > "$E/source.txt"
          git archive --format=tar.gz HEAD > "$E/source.tar.gz"
          git archive --format=tar.gz "$BASELINE" > "$E/baseline-source.tar.gz"
          printf 'baseline=%s\nmode=%s\n' "$BASELINE" "$CANDIDATE_MODE" > "$E/campaign.txt"
          go version > "$E/toolchain.txt"
          go env -json GOARCH GOOS GOEXPERIMENT CGO_ENABLED GOAMD64 > "$E/compiler-env.json"
          python3 - <<'PY' > "$E/runtime-env.json"
          import json, os
          print(json.dumps({k: os.environ.get(k) for k in ('GOGC','GOMEMLIMIT','GODEBUG','GOMAXPROCS')}, indent=2))
          PY
          cp go.mod go.sum "$E/"
          go mod download
          go mod verify > "$E/module-verify.txt"
          test -z "$(gofmt -l ack_writer_budget_test.go)"
          python3 -m unittest discover -s tests/e2eperf -p 'test_*.py' -v > "$E/python-tests.txt" 2>&1
          for side in baseline candidate; do
            T="$RUNNER_TEMP/ack-budget-$side"
            ref="$BASELINE"
            if [ "$side" = candidate ]; then ref=HEAD; fi
            git worktree add --detach "$T" "$ref"
            cmp go.mod "$T/go.mod"; cmp go.sum "$T/go.sum"
            cp ack_writer_budget_test.go "$T/"
            cp tests/e2eperf/*.go "$T/tests/e2eperf/"
            if [ "$side" = candidate ] && [ "$CANDIDATE_MODE" = isolated ]; then
              python3 tests/e2eperf/ack_writer_experiment.py --source "$T"
              gofmt -w "$T/serialize.go"
            fi
            (cd "$T" && git diff -- serialize.go > "$E/$side.patch" && go build -mod=readonly -trimpath -o "$E/worker-$side" ./tests/e2eperf && go test -mod=readonly -trimpath -c -o "$E/bench-$side" .)
            go version -m "$E/worker-$side" > "$E/build-$side.txt"
          done
          if [ "$CANDIDATE_MODE" = adopted ]; then test ! -s "$E/candidate.patch"; else test -s "$E/candidate.patch"; fi
      - name: Baseline and candidate behavior failure and concurrency contracts
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/ack-budget-evidence"
          (cd "$RUNNER_TEMP/ack-budget-baseline" && go test -mod=readonly -count=1 -json -run '^Test(ACKWriterBudget|WriterBufferAcknowledgementVisibility)' . > "$E/baseline-boundaries.jsonl")
          cd "$RUNNER_TEMP/ack-budget-candidate"
          go vet -mod=readonly ./... > "$E/vet.txt" 2>&1
          go test -mod=readonly -count=1 -json ./... > "$E/full.jsonl"
          go test -mod=readonly -race -shuffle=on -count=3 -json ./... > "$E/race.jsonl"
          go test -mod=readonly -run '^$' -fuzz '^FuzzACKMaximumMatchesScalar$' -fuzztime=8s > "$E/ack-fuzz.txt"
          python3 tests/e2eperf/ack_writer_experiment.py --source . --negative "$E/negative" > "$E/negative.json"
          git diff --exit-code -- go.mod go.sum
      - name: Matched constructor allocation and scalar writer work
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/ack-budget-evidence"
          python3 tests/e2eperf/bench_pairs.py --baseline "$E/bench-baseline" --candidate "$E/bench-candidate" --suite ack-writer --pairs 5 --iterations 64 --out "$E/public" > "$E/public.json"
          python3 tests/e2eperf/bench_pairs.py --baseline "$E/bench-candidate" --candidate "$E/bench-candidate" --suite ack-writer --pairs 5 --iterations 64 --out "$E/public-aa" > "$E/public-aa.json"
      - name: Lifecycle large-record and rotation guardrails bracketed by controls
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/ack-budget-evidence"
          printf '%s\n' '[{"name":"same-small","count":512,"payload":256,"writers":8,"ack_percent":50,"scans":0},{"name":"same-large","count":64,"payload":262144,"writers":4,"ack_percent":50,"scans":0}]' > "$E/aa-cases.json"
          python3 tests/e2eperf/observe.py --out "$E/host-before" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-candidate" --candidate "$E/worker-candidate" --cases "$E/aa-cases.json" --pairs 5 --out "$E/aa-before"
          python3 tests/e2eperf/observe.py --out "$E/host-paired" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-baseline" --candidate "$E/worker-candidate" --cases tests/e2eperf/ack_writer_cases.json --pairs 5 --out "$E/paired"
          python3 tests/e2eperf/observe.py --out "$E/host-after" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-candidate" --candidate "$E/worker-candidate" --cases "$E/aa-cases.json" --pairs 5 --out "$E/aa-after"
          python3 tests/e2eperf/qualify.py --before "$E/aa-before/report.json" --after "$E/aa-after/report.json" > "$E/timing-qualification.json"
      - name: Separate allocation live-heap and syscall diagnostics
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/ack-budget-evidence"
          for side in baseline candidate; do
            for kind in cpu trace; do
              python3 tests/e2eperf/run.py --binary "$E/worker-$side" --out "$E/$side-$kind" --count 512 --payload 256 --writers 8 --ack-percent 100 --rotate-every 16 --scans 2 --diagnostics "$kind" > "$E/$side-$kind.log"
            done
            go tool pprof -top -nodecount=20 -sample_index=alloc_space -base="$E/$side-cpu/seed/alloc-before.pprof" "$E/worker-$side" "$E/$side-cpu/seed/alloc.pprof" > "$E/$side-seed-alloc.txt"
            go tool pprof -top -nodecount=20 -sample_index=inuse_space "$E/worker-$side" "$E/$side-cpu/seed/heap.pprof" > "$E/$side-seed-heap.txt"
            go tool trace -pprof=syscall "$E/$side-trace/seed/trace.out" > "$E/$side-syscall.pprof"
            if command -v strace >/dev/null; then
              strace -f -c -e trace=write -o "$E/$side-write-count.txt" "$E/bench-$side" -test.run='^$' -test.bench='^BenchmarkACKWriterResources/write-plain$' -test.benchtime=32x > "$E/$side-write-work.txt"
            else
              echo 'strace unavailable; no syscall count claim' > "$E/$side-write-count.txt"
            fi
          done
      - name: Preserve complete evidence including failures
        if: always()
        shell: bash
        run: |
          E="$RUNNER_TEMP/ack-budget-evidence"
          mkdir -p "$E"; cd "$E"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Independently recompute frozen evidence
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/ack-budget-evidence"
          python3 tests/e2eperf/bench_pairs.py --verify "$E/public" > /dev/null
          python3 tests/e2eperf/bench_pairs.py --verify "$E/public-aa" > /dev/null
          python3 tests/e2eperf/verify.py --root "$E" --campaign paired=worker-baseline,worker-candidate --campaign aa-before=worker-candidate,worker-candidate --campaign aa-after=worker-candidate,worker-candidate > "$RUNNER_TEMP/ack-budget-verified.json"
          cat "$RUNNER_TEMP/ack-budget-verified.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ack-writer-budget-reproduction-${{ github.run_id }}
          path: ${{ runner.temp }}/ack-budget-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
