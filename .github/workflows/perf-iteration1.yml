name: Journal buffer iteration
on:
  push:
    branches: [perf/measured-journal-20260923]
    paths: [.github/workflows/perf-iteration1.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Validate wire-equivalent empty bytes in the baseline fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('performance_contract_test.go');s=p.read_text()
          old='!reflect.DeepEqual(expected, &got)'
          assert s.count(old)==1
          s=s.replace(old,'expected.ID != got.ID || got.Data["label"] != expected.Data["label"] || !bytes.Equal(expected.Data["body"].([]byte), got.Data["body"].([]byte))')
          p.write_text(s)
          PY
          gofmt -w performance_contract_test.go
          go test -mod=readonly -count=1 -run TestPerformanceContract ./...
      - name: Reduce decoder lookahead without touching writer or Sync semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('serialize.go');s=p.read_text()
          assert s.count('NewReaderSize(')==4
          assert s.count('defaultCompressNBlocks = 8')==1
          s=s.replace('defaultCompressNBlocks = 8','defaultCompressNBlocks = 8\n\t// Readers need bounded lookahead, not the 4 MiB writer/compressor buffer.\n\t// Individual records may still exceed this size.\n\treadBufferSize = 64 << 10')
          s=s.replace('NewReaderSize(decoder.gzReader, BufSize)','NewReaderSize(decoder.gzReader, readBufferSize)').replace('NewReaderSize(fp, BufSize)','NewReaderSize(fp, readBufferSize)')
          assert s.count('NewReaderSize(')==s.count(', readBufferSize)')==4
          p.write_text(s)
          PY
          gofmt -w serialize.go
      - name: Verify the dependency's actual module graph and all correctness gates
        run: |
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s ./...
          git diff --exit-code -- go.mod go.sum
      - name: Publish only tested sources
        run: |
          git config user.name Laisky
          git config user.email public@laisky.com
          git add serialize.go performance_contract_test.go
          git commit -m 'perf(journal): bound decoder buffers while preserving large-record recovery'
          git push origin HEAD:refs/heads/perf/measured-journal-20260923
