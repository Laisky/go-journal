name: Journal confirmation iteration
on:
  push:
    branches: [perf/measured-journal-20260923]
    paths: [.github/workflows/perf-iteration2.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Validate refresh behavior before optimization
        run: go test -mod=readonly -race -count=3 -run TestPerformanceContractConcurrentRefresh ./...
      - name: Replace repeated map operations with atomic Swap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('set.go');s=p.read_text()
          assert s.count('chgLock  *sync.Mutex')==1
          s=s.replace('\tchgLock  *sync.Mutex\n','').replace('\t\tchgLock:  &sync.Mutex{},\n','')
          a=s.index('\tif _, ok := s.ng.LoadOrStore(id, t);')
          z=s.index('\n\ts.RUnlock()',a)
          s=s[:a]+'''\t// Swap publishes a refreshed deadline in one map operation. The generation
          \t// read lock prevents rotation until the unique-entry count is updated.
          \tif _, loaded := s.ng.Swap(id, t); !loaded {
          \t\tatomic.AddInt64(&s.ngN, 1)
          \t}'''+s[z:]
          p.write_text(s)
          PY
          gofmt -w set.go performance_ttl_test.go
      - name: Validate all contracts with the original module graph
        run: |
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s ./...
          git diff --exit-code -- go.mod go.sum
      - name: Push validated optimization
        run: |
          git config user.name Laisky
          git config user.email public@laisky.com
          git add set.go performance_ttl_test.go
          git commit -m 'perf(journal): refresh confirmation deadlines with one atomic map operation'
          git push origin HEAD:refs/heads/perf/measured-journal-20260923
