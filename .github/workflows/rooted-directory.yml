name: Retained journal directory contracts
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Native build, behavior, and race acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          go version | tee evidence/toolchain.txt
          git rev-parse HEAD HEAD^{tree} > evidence/source.txt
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -json -count=1 -timeout=180s ./... | tee evidence/full.jsonl
          go test -mod=readonly -json -race -count=3 -shuffle=on -timeout=180s ./... | tee evidence/race.jsonl
          go test -mod=readonly -run '^$' -bench '^BenchmarkJournalFilesystemOpen$' -benchmem -count=3 . | tee evidence/filesystem-bench.txt
          git diff --exit-code -- go.mod go.sum
      - name: Require original-path assertion failures, not build errors
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/root-baseline" a7f7377c4a3dfe3e76244412c082e1e76e121b44
          cp rooted_regression_test.go "$RUNNER_TEMP/root-baseline/"
          set +e
          (cd "$RUNNER_TEMP/root-baseline"; go test -mod=readonly -json -count=1 -timeout=90s -run 'TestRegressionJournal|TestJournalRootLockInteroperates' .) > evidence/baseline.jsonl 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(s) for s in Path('evidence/baseline.jsonl').read_text().splitlines() if s.startswith('{')]
          for test in ('TestRegressionJournalRotationStaysWithOpenedDirectory',):
              assert any(e.get('Test') == test and e.get('Action') == 'fail' for e in events), test
          assert any(e.get('Test') == 'TestJournalRootLockInteroperatesWithExistingBackend' and e.get('Action') == 'pass' for e in events)
          output = ''.join(e.get('Output', '') for e in events)
          assert 'JOURNAL_ROOT_REGRESSION' in output
          assert not any(e.get('Action') == 'skip' for e in events)
          PY
      - name: Require interrupted-tail failures on the original rooted implementation
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/root-recovery-baseline" b6c45ccdaae6d4e49b17c0c929895dbff72a607f
          cp rooted_recovery_test.go "$RUNNER_TEMP/root-recovery-baseline/"
          set +e
          (cd "$RUNNER_TEMP/root-recovery-baseline"; go test -mod=readonly -json -count=1 -timeout=90s -run '^TestJournalRootInterruptedEvidenceAfterDirectoryReplacement$' .) > evidence/recovery-baseline.jsonl 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(s) for s in Path('evidence/recovery-baseline.jsonl').read_text().splitlines() if s.startswith('{')]
          parent = 'TestJournalRootInterruptedEvidenceAfterDirectoryReplacement'
          for config in ('path-dot', 'borrowed'):
              for gzip in ('false', 'true'):
                  test = f'{parent}/config={config}/gzip={gzip}/corrupt=false'
                  assert any(e.get('Test') == test and e.get('Action') == 'fail' for e in events), test
          for config in ('path', 'path-dot', 'borrowed'):
              for gzip in ('false', 'true'):
                  test = f'{parent}/config={config}/gzip={gzip}/corrupt=true'
                  assert any(e.get('Test') == test and e.get('Action') == 'pass' for e in events), test
          output = ''.join(e.get('Output', '') for e in events)
          assert 'tail leaked: load legacy data: read legacy data: unexpected EOF' in output
          assert not any(e.get('Action') == 'skip' for e in events)
          PY
      - name: Require confinement failures without no-follow
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/root-open-negative" HEAD
          python3 - "$RUNNER_TEMP/root-open-negative/rooted_open_linux.go" <<'PYTEST'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          source = p.read_text()
          assert source.count('flags|syscall.O_NOFOLLOW|syscall.O_CLOEXEC') == 1
          p.write_text(source.replace('flags|syscall.O_NOFOLLOW|syscall.O_CLOEXEC', 'flags|syscall.O_CLOEXEC'))
          PYTEST
          set +e
          (cd "$RUNNER_TEMP/root-open-negative"; go test -mod=readonly -json -count=1 -timeout=90s -run '^TestRootedOpenConfinesSymlinkSwapsAndConcurrentClose$' .) > evidence/nofollow-negative.jsonl 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          events = [json.loads(s) for s in Path('evidence/nofollow-negative.jsonl').read_text().splitlines() if s.startswith('{')]
          parent = 'TestRootedOpenConfinesSymlinkSwapsAndConcurrentClose'
          assert any(e.get('Test') == parent + '/standard=false' and e.get('Action') == 'fail' for e in events)
          assert any(e.get('Test') == parent + '/standard=true' and e.get('Action') == 'pass' for e in events)
          assert 'accepted escaping or absolute symlink' in ''.join(e.get('Output', '') for e in events)
          assert not any(e.get('Action') == 'skip' for e in events)
          PYTEST
      - name: Preserve native results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rooted-directory-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
