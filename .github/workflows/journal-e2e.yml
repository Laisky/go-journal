name: Journal E2E performance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: journal-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      BASELINE: bab91ebc1119a7e6443726fe9c400902ddd6fbbb
      CANDIDATE_MODE: adopted
      CONTIGUOUS: cb2536d723a4e3e6b4cc665b498c6bc63d1b1aba
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Build identical workloads and require exact adopted source
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/staging-evidence"
          mkdir -p "$E"
          git rev-parse HEAD HEAD^{tree} > "$E/source.txt"
          git archive --format=tar.gz HEAD > "$E/source.tar.gz"
          git archive --format=tar.gz "$BASELINE" > "$E/baseline-source.tar.gz"
          printf 'baseline=%s\ncandidate_mode=%s\n' "$BASELINE" "$CANDIDATE_MODE" > "$E/campaign.txt"
          git archive --format=tar.gz "$CONTIGUOUS" > "$E/contiguous-source.tar.gz"
          printf 'contiguous=%s\n' "$CONTIGUOUS" >> "$E/campaign.txt"
          go version > "$E/toolchain.txt"
          go env -json GOARCH GOOS GOEXPERIMENT CGO_ENABLED GOAMD64 > "$E/compiler-env.json"
          python3 - <<'PY' > "$E/runtime-env.json"
          import json, os
          print(json.dumps({k: os.environ.get(k) for k in ('GOGC','GOMEMLIMIT','GODEBUG','GOMAXPROCS')}, indent=2))
          PY
          cp go.mod go.sum "$E/"
          go mod download
          go mod verify > "$E/module-verify.txt"
          test -z "$(gofmt -l record_stage*.go)"
          python3 -m unittest discover -s tests/e2eperf -p 'test_*.py' -v > "$E/python-tests.txt" 2>&1
          for side in baseline candidate; do
            T="$RUNNER_TEMP/staging-$side"
            ref=HEAD
            if [ "$side" = baseline ]; then ref="$BASELINE"; fi
            git worktree add --detach "$T" "$ref"
            cmp go.mod "$T/go.mod"
            cmp go.sum "$T/go.sum"
            cp tests/e2eperf/*.go "$T/tests/e2eperf/"
            cp record_stage.go record_stage_test.go "$T/"
            if [ "$side" = candidate ] && [ "$CANDIDATE_MODE" = isolated ]; then
              python3 tests/e2eperf/staging_experiment.py --source "$T"
              gofmt -w "$T/serialize.go"
            fi
            (cd "$T" && git diff -- serialize.go > "$E/$side.patch" && go build -mod=readonly -trimpath -o "$E/worker-$side" ./tests/e2eperf)
            go version -m "$E/worker-$side" > "$E/build-$side.txt"
          done
          if [ "$CANDIDATE_MODE" = adopted ]; then test ! -s "$E/candidate.patch"; else test -s "$E/candidate.patch"; fi
          # Reconstruct the first measured prototype with its own helper/script,
          # not the new segmented implementation. Only the external worker matches.
          T="$RUNNER_TEMP/staging-contiguous"
          git worktree add --detach "$T" "$CONTIGUOUS"
          cmp go.mod "$T/go.mod"
          cmp go.sum "$T/go.sum"
          cp tests/e2eperf/*.go "$T/tests/e2eperf/"
          python3 "$T/tests/e2eperf/staging_experiment.py" --source "$T"
          gofmt -w "$T/serialize.go"
          (cd "$T" && git diff -- serialize.go > "$E/contiguous.patch" && go build -mod=readonly -trimpath -o "$E/worker-contiguous" ./tests/e2eperf)
          go version -m "$E/worker-contiguous" > "$E/build-contiguous.txt"
          sha256sum "$E"/worker-* tests/e2eperf/*.* record_stage*.go > "$E/build-hashes.txt"
      - name: Baseline boundaries and candidate behavior race fuzz mutations
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/staging-evidence"
          (cd "$RUNNER_TEMP/staging-baseline" && go test -mod=readonly -count=1 -run '^(TestRecordStage|TestWriterBuffer)' -json ./... > "$E/baseline-boundaries.jsonl")
          cd "$RUNNER_TEMP/staging-candidate"
          go vet -mod=readonly ./... > "$E/vet.txt" 2>&1
          go test -mod=readonly -count=1 -json ./... > "$E/full.jsonl"
          go test -mod=readonly -race -shuffle=on -count=3 -json ./... > "$E/race.jsonl"
          go test -mod=readonly -run '^$' -fuzz '^FuzzIDScanMatchesGenerated$' -fuzztime=8s > "$E/maxid-fuzz.txt"
          python3 tests/e2eperf/negative.py --out "$E/negative" > "$E/negative-summary.json"
          python3 tests/e2eperf/sync_experiment.py --source . --negative "$E/sync-negative" > "$E/sync-negative-summary.json"
          python3 tests/e2eperf/segment_negative.py --out "$E/segment-negative" > "$E/segment-negative-summary.json"
          python3 tests/e2eperf/ack_negative.py --out "$E/ack-negative" > "$E/ack-negative-summary.json"
          python3 tests/e2eperf/staging_negative.py --out "$E/staging-negative" > "$E/staging-negative-summary.json"
          git diff --exit-code -- go.mod go.sum
      - name: Identical-binary control before the campaign
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/staging-evidence"
          printf '%s\n' '[{"name":"same-small","count":256,"payload":1024,"writers":4,"ack_percent":50,"scans":0},{"name":"same-large","count":32,"payload":262144,"writers":4,"ack_percent":50,"scans":0}]' > "$E/aa-cases.json"
          python3 tests/e2eperf/observe.py --out "$E/host-before" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-candidate" --candidate "$E/worker-candidate" --cases "$E/aa-cases.json" --pairs 5 --out "$E/aa-before"
      - name: Nine paired transactional append and recovery loads
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/staging-evidence"
          python3 tests/e2eperf/observe.py --out "$E/host-paired" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-baseline" --candidate "$E/worker-candidate" --cases tests/e2eperf/staging_cases.json --pairs 5 --out "$E/staging-paired"
      - name: Isolate segmented overflow against the contiguous prototype
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/staging-evidence"
          python3 tests/e2eperf/observe.py --out "$E/host-overflow" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-contiguous" --candidate "$E/worker-candidate" --cases tests/e2eperf/staging_overflow_cases.json --pairs 5 --out "$E/overflow-paired"
      - name: Identical-binary control after and unchanged qualification
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/staging-evidence"
          python3 tests/e2eperf/observe.py --out "$E/host-after" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-candidate" --candidate "$E/worker-candidate" --cases "$E/aa-cases.json" --pairs 5 --out "$E/aa-after"
          python3 tests/e2eperf/qualify.py --before "$E/aa-before/report.json" --after "$E/aa-after/report.json" > "$E/timing-qualification.json"
      - name: Separate allocation benchmarks and fixed-work CPU heap trace evidence
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/staging-evidence"
          for side in baseline candidate; do
            (cd "$RUNNER_TEMP/staging-$side" && go test -mod=readonly -run '^$' -bench '^(BenchmarkRecordStagingWrites|BenchmarkWriterPairConstruction)$' -benchtime=64x -count=5 -benchmem > "$E/bench-$side.txt")
            for kind in cpu trace; do
              python3 tests/e2eperf/run.py --binary "$E/worker-$side" --out "$E/$side-$kind" --count 256 --payload 262144 --writers 4 --ack-percent 0 --scans 0 --diagnostics "$kind" > "$E/$side-$kind.log"
            done
            for mode in seed transfer; do
              go tool pprof -top -nodecount=20 -sample_index=alloc_space -base="$E/$side-cpu/$mode/alloc-before.pprof" "$E/worker-$side" "$E/$side-cpu/$mode/alloc.pprof" > "$E/$side-$mode-alloc.txt"
              go tool pprof -top -nodecount=20 -sample_index=inuse_space "$E/worker-$side" "$E/$side-cpu/$mode/heap.pprof" > "$E/$side-$mode-heap.txt"
              go tool pprof -top -nodecount=20 "$E/worker-$side" "$E/$side-cpu/$mode/cpu.pprof" > "$E/$side-$mode-cpu.txt"
              go tool trace -pprof=syscall "$E/$side-trace/$mode/trace.out" > "$E/$side-trace/$mode/syscall.pprof"
            done
          done
          for side in contiguous candidate; do
            python3 tests/e2eperf/run.py --binary "$E/worker-$side" --out "$E/overflow-$side-cpu" --count 16 --payload 4194304 --writers 2 --ack-percent 0 --scans 0 --diagnostics cpu > "$E/overflow-$side-cpu.log"
            go tool pprof -top -nodecount=20 -sample_index=alloc_space -base="$E/overflow-$side-cpu/seed/alloc-before.pprof" "$E/worker-$side" "$E/overflow-$side-cpu/seed/alloc.pprof" > "$E/overflow-$side-alloc.txt"
          done
          cat "$E/baseline-seed-alloc.txt" "$E/candidate-seed-alloc.txt"
      - name: Retain evidence hashes even after failure
        if: always()
        shell: bash
        run: |
          E="$RUNNER_TEMP/staging-evidence"
          mkdir -p "$E"
          cd "$E"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Recompute every audit assessment and median
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/staging-evidence"
          python3 tests/e2eperf/verify.py --root "$E" \
            --campaign staging-paired=worker-baseline,worker-candidate \
            --campaign overflow-paired=worker-contiguous,worker-candidate \
            --campaign aa-before=worker-candidate,worker-candidate \
            --campaign aa-after=worker-candidate,worker-candidate > "$RUNNER_TEMP/verified-staging.json"
          cat "$RUNNER_TEMP/verified-staging.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: journal-staging-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/staging-evidence
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
