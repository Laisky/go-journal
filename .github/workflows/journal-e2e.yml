name: Journal E2E performance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: journal-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      BASELINE: a295f519c37dce75ddedac3803f26a46c9ad7279
      SYNC_EXPERIMENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Build one frozen worker against baseline and explicit candidate
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/journal-evidence"
          C="$RUNNER_TEMP/journal-candidate"
          B="$RUNNER_TEMP/journal-baseline"
          mkdir -p "$E"
          git rev-parse HEAD HEAD^{tree} > "$E/source.txt"
          printf 'baseline=%s\nexperimental_patch=%s\n' "$BASELINE" "$SYNC_EXPERIMENT" > "$E/campaign.txt"
          git archive --format=tar.gz HEAD > "$E/source.tar.gz"
          go version > "$E/toolchain.txt"
          cp go.mod go.sum "$E/"
          go mod download
          go mod verify > "$E/module-verify.txt"
          git worktree add --detach "$C" HEAD
          if [ "$SYNC_EXPERIMENT" = 1 ]; then
            python3 tests/e2eperf/sync_experiment.py --source "$C" --apply
          fi
          (cd "$C" && git diff > "$E/candidate.patch" && go build -mod=readonly -trimpath -o "$E/worker-candidate" ./tests/e2eperf)
          cp "$C/journal.go" "$E/candidate-journal.go"
          git worktree add --detach "$B" "$BASELINE"
          cmp go.mod "$B/go.mod"
          cmp go.sum "$B/go.sum"
          cp tests/e2eperf/*.go "$B/tests/e2eperf/"
          (cd "$B" && go build -mod=readonly -trimpath -o "$E/worker-baseline" ./tests/e2eperf)
          go version -m "$E/worker-candidate" > "$E/build-candidate.txt"
          go version -m "$E/worker-baseline" > "$E/build-baseline.txt"
          sha256sum "$E"/worker-* tests/e2eperf/*.* > "$E/build-hashes.txt"
          python3 -m unittest discover -s tests/e2eperf -p 'test_*.py' -v 2>&1 | tee "$E/python-tests.txt"
      - name: Candidate correctness race crash and executable negative controls
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/journal-evidence"
          cd "$RUNNER_TEMP/journal-candidate"
          go vet -mod=readonly ./... > "$E/vet.txt" 2>&1
          go test -mod=readonly -count=1 -json ./... > "$E/full.jsonl"
          go test -mod=readonly -race -shuffle=on -count=3 -json ./... > "$E/race.jsonl"
          go test -mod=readonly -run '^$' -fuzz '^FuzzIDScanMatchesGenerated$' -fuzztime=8s > "$E/maxid-fuzz.txt"
          python3 tests/e2eperf/negative.py --out "$E/negative" > "$E/negative-summary.json"
          python3 tests/e2eperf/sync_experiment.py --source . --negative "$E/sync-negative" > "$E/sync-negative-summary.json"
          git diff --exit-code -- go.mod go.sum
      - name: Five paired durable-load trials with single-writer controls
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/journal-evidence"
          python3 tests/e2eperf/compare.py --baseline "$E/worker-baseline" --candidate "$E/worker-candidate" --cases tests/e2eperf/sync_cases.json --pairs 5 --out "$E/sync-paired" > "$E/sync-medians.json"
          python3 - <<'PY'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'journal-evidence/sync-paired/report.json').read_text())
          for case, metrics in r['assessment'].items():
              for key in ('lifecycle_seconds','seed_sync_p99_ms','seed/append_sync_deliver_ack/seconds','seed/append_sync_deliver_ack/cpu_seconds','seed/append_sync_deliver_ack/allocated_bytes'):
                  m=metrics[key]
                  print(case,key,m['baseline_median'],m['candidate_median'],m['median_ratio'],m['interval95'],m['status'])
          PY
      - name: Existing scan and recovery regression workloads
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/journal-evidence"
          python3 tests/e2eperf/compare.py --baseline "$E/worker-baseline" --candidate "$E/worker-candidate" --cases tests/e2eperf/cases.json --pairs 5 --out "$E/scan-guardrails" > "$E/scan-guardrails-medians.json"
      - name: Separate CPU heap lock and traced syscall evidence for both versions
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/journal-evidence"
          for side in baseline candidate; do
            for kind in cpu trace contention; do
              python3 tests/e2eperf/run.py --binary "$E/worker-$side" --out "$E/$side-$kind" --count 1024 --payload 1024 --writers 16 --ack-percent 50 --scans 0 --diagnostics "$kind" > "$E/$side-$kind.log"
            done
            go tool trace -pprof=syscall "$E/$side-trace/seed/trace.out" > "$E/$side-trace/seed/syscall.pprof"
            go tool trace -pprof=sync "$E/$side-trace/seed/trace.out" > "$E/$side-trace/seed/sync.pprof"
            go tool pprof -top -nodecount=20 -sample_index=contentions -focus=syncLocked "$E/worker-$side" "$E/$side-trace/seed/syscall.pprof" > "$E/$side-syscall-count.txt"
            go tool pprof -top -nodecount=20 "$E/worker-$side" "$E/$side-trace/seed/syscall.pprof" > "$E/$side-syscall-delay.txt"
            go tool pprof -top -nodecount=20 "$E/worker-$side" "$E/$side-contention/seed/mutex.pprof" > "$E/$side-mutex.txt"
            go tool pprof -top -nodecount=20 -tagfocus=phase=append_sync_deliver_ack "$E/worker-$side" "$E/$side-cpu/seed/cpu.pprof" > "$E/$side-cpu.txt"
            go tool pprof -top -nodecount=20 -sample_index=alloc_space -base="$E/$side-cpu/seed/alloc-before.pprof" "$E/worker-$side" "$E/$side-cpu/seed/alloc.pprof" > "$E/$side-alloc.txt"
          done
          cat "$E/baseline-syscall-count.txt" "$E/candidate-syscall-count.txt"
      - name: Identical-binary measurement control
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/journal-evidence"
          printf '%s\n' '[{"name":"same-binary","count":1024,"payload":1024,"writers":16,"ack_percent":50,"scans":0}]' > "$E/aa-cases.json"
          python3 tests/e2eperf/compare.py --baseline "$E/worker-candidate" --candidate "$E/worker-candidate" --cases "$E/aa-cases.json" --pairs 5 --out "$E/aa" > "$E/aa-medians.json"
      - name: Retain evidence hashes even after failure
        if: always()
        shell: bash
        run: |
          E="$RUNNER_TEMP/journal-evidence"
          mkdir -p "$E"
          cd "$E"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: journal-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/journal-evidence
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
