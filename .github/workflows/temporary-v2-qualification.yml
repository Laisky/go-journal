name: Temporary journal v2 full E2E qualification
on:
  push:
    branches: [codex/retained-storage-budget]
permissions:
  contents: read
jobs:
  collector-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Laisky/go-fluentd
          ref: 831775cee73103df90e0f04350578e3e2cce1d4e
          path: collector
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      - name: Collector controller/receiver/sender race and journal integration
        working-directory: collector
        shell: bash
        run: |
          set -euo pipefail
          go mod edit -replace=github.com/Laisky/go-journal/v2=..
          go test -mod=mod -race -count=1 ./internal/controller ./internal/recvs ./internal/senders ./library/otlpwire
  format-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      - name: Print gofmt difference for E2E fixture
        run: gofmt -d storage_guard_e2e_test.go
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
      - name: Full root-module behavioral and subprocess E2E suites
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test -mod=readonly -count=1 ./...
          go test -mod=readonly -race -shuffle=on -count=2 ./...
          go test -mod=readonly -race -count=10 -run '^(TestStorageGuardRegressionContracts|TestGuardedJournalDurableReplayAndArchiveEndToEnd)$' .
          go vet -mod=readonly ./...
      - name: Independent dependency-security consumer suite
        shell: bash
        working-directory: tests/dependencysecurity
        run: |
          set -euo pipefail
          go mod verify
          go test -mod=readonly -race -count=1 ./...
      - name: Verify repository modules remained immutable
        run: git diff --exit-code -- go.mod go.sum tests/dependencysecurity/go.mod tests/dependencysecurity/go.sum
