name: Buffered ACK imports
# Historical experiment; ongoing protection is benchmark-regression.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ack-offset-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      BASELINE: c013e4b87458da53950c7b530726d29f035bfe35
      CANDIDATE_MODE: adopted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ad3ce410a1c6005b581ead6c5fdf6a24e9c5d324
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Freeze exact source and independent ACK-word candidate
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/offset-evidence"
          mkdir -p "$E"
          git rev-parse HEAD HEAD^{tree} > "$E/source.txt"
          git archive --format=tar.gz HEAD > "$E/source.tar.gz"
          git archive --format=tar.gz "$BASELINE" > "$E/baseline-source.tar.gz"
          printf 'baseline=%s\nmode=%s\n' "$BASELINE" "$CANDIDATE_MODE" > "$E/campaign.txt"
          go version > "$E/toolchain.txt"
          go env -json GOARCH GOOS GOEXPERIMENT CGO_ENABLED GOAMD64 > "$E/compiler-env.json"
          cp go.mod go.sum "$E/"
          go mod download
          go mod verify > "$E/module-verify.txt"
          test -z "$(gofmt -l ack_offset*.go)"
          python3 -m unittest discover -s tests/e2eperf -p 'test_*.py' -v > "$E/python-tests.txt" 2>&1
          for side in baseline candidate; do
            T="$RUNNER_TEMP/offset-$side"
            ref="$BASELINE"; if [ "$side" = candidate ]; then ref=HEAD; fi
            git worktree add --detach "$T" "$ref"
            cmp go.mod "$T/go.mod"; cmp go.sum "$T/go.sum"
            cp ack_offset*test.go "$T/"
            cp tests/e2eperf/*.go "$T/tests/e2eperf/"
            if [ "$side" = candidate ] && [ "$CANDIDATE_MODE" = isolated ]; then
              python3 tests/e2eperf/ack_offset_experiment.py --source "$T"
              gofmt -w "$T/serialize.go"
            fi
            (cd "$T" && git diff -- serialize.go > "$E/$side.patch" && go build -mod=readonly -trimpath -o "$E/worker-$side" ./tests/e2eperf && go test -mod=readonly -trimpath -c -o "$E/bench-$side" .)
            go version -m "$E/worker-$side" > "$E/build-$side.txt"
          done
          if [ "$CANDIDATE_MODE" = adopted ]; then test ! -s "$E/candidate.patch"; else test -s "$E/candidate.patch"; fi
          python3 - <<'PY' > "$E/source-check.json"
          import json, os, pathlib, sys
          sys.path.insert(0,'tests/e2eperf')
          from ack_offset_experiment import transform
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'offset-baseline'
          after=base.with_name('offset-candidate')
          paths={str(p.relative_to(base)) for p in base.rglob('*.go')}
          assert paths=={str(p.relative_to(after)) for p in after.rglob('*.go')}
          assert (after/'serialize.go').read_text()==transform((base/'serialize.go').read_text())
          for name in paths-{'serialize.go'}: assert (base/name).read_bytes()==(after/name).read_bytes(),name
          print(json.dumps({'only_changed_production':'serialize.go','identical_go_files':len(paths)-1},indent=2))
          PY
      - name: Differential boundary errors callbacks full race fuzz and real mutant
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/offset-evidence"
          (cd "$RUNNER_TEMP/offset-baseline" && go test -mod=readonly -count=1 -run '^TestACKOffset' -json . > "$E/baseline-tests.jsonl")
          cd "$RUNNER_TEMP/offset-candidate"
          go vet -mod=readonly ./... > "$E/vet.txt" 2>&1
          go test -mod=readonly -count=1 -json ./... > "$E/full.jsonl"
          go test -mod=readonly -race -shuffle=on -count=3 -json ./... > "$E/race.jsonl"
          go test -mod=readonly -run '^$' -fuzz '^FuzzACKOffsetMatchesReadFull$' -fuzztime=10s > "$E/offset-fuzz.txt"
          python3 "$GITHUB_WORKSPACE/tests/e2eperf/ack_offset_experiment.py" --source . --negative "$E/negative" > "$E/negative.json"
          git diff --exit-code -- go.mod go.sum
      - name: Public ACK imports and real TTL replay with identical-binary controls
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/offset-evidence"
          for suite in ack-offset ack-replay; do
            python3 tests/e2eperf/bench_pairs.py --baseline "$E/bench-baseline" --candidate "$E/bench-candidate" --suite "$suite" --pairs 5 --iterations 128 --out "$E/public-$suite" > "$E/public-$suite.json"
            python3 tests/e2eperf/bench_pairs.py --baseline "$E/bench-candidate" --candidate "$E/bench-candidate" --suite "$suite" --pairs 5 --iterations 128 --out "$E/aa-$suite" > "$E/aa-$suite.json"
          done
      - name: Durable lifecycle controls and unchanged timing policy
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/offset-evidence"
          printf '%s\n' '[{"name":"same-small","count":512,"payload":256,"writers":8,"ack_percent":50,"scans":0},{"name":"same-dense","count":2048,"payload":256,"writers":8,"ack_percent":100,"scans":0}]' > "$E/aa-cases.json"
          python3 tests/e2eperf/observe.py --out "$E/host-before" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-candidate" --candidate "$E/worker-candidate" --cases "$E/aa-cases.json" --pairs 5 --out "$E/aa-before"
          python3 tests/e2eperf/observe.py --out "$E/host-paired" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-baseline" --candidate "$E/worker-candidate" --cases tests/e2eperf/ack_offset_cases.json --pairs 5 --out "$E/paired"
          python3 tests/e2eperf/observe.py --out "$E/host-after" -- python3 tests/e2eperf/compare.py --baseline "$E/worker-candidate" --candidate "$E/worker-candidate" --cases "$E/aa-cases.json" --pairs 5 --out "$E/aa-after"
          python3 tests/e2eperf/qualify.py --before "$E/aa-before/report.json" --after "$E/aa-after/report.json" > "$E/timing-qualification.json"
      - name: Separate fixed-work CPU allocation and execution trace evidence
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/offset-evidence"
          for side in baseline candidate; do
            "$E/bench-$side" -test.run='^$' -test.bench='^BenchmarkPublicACKOffset/sink-128k$' -test.benchtime=1024x -test.cpuprofile="$E/$side-offset.pprof" -test.memprofile="$E/$side-alloc.pprof" > "$E/$side-profile.log"
            go tool pprof -top -nodecount=25 -tagfocus=phase=public-ack-offset "$E/bench-$side" "$E/$side-offset.pprof" > "$E/$side-cpu.txt"
            python3 tests/e2eperf/run.py --binary "$E/worker-$side" --out "$E/$side-trace" --count 2048 --payload 256 --writers 16 --ack-percent 50 --scans 0 --diagnostics trace > "$E/$side-trace.log"
            go tool trace -pprof=sync "$E/$side-trace/transfer/trace.out" > "$E/$side-transfer-sync.pprof"
          done
      - name: Preserve complete evidence including failures
        if: always()
        shell: bash
        run: |
          E="$RUNNER_TEMP/offset-evidence"
          mkdir -p "$E";cd "$E"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Recompute all raw benchmark and lifecycle reports
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/offset-evidence"
          for suite in ack-offset ack-replay; do
            python3 tests/e2eperf/bench_pairs.py --verify "$E/public-$suite" > /dev/null
            python3 tests/e2eperf/bench_pairs.py --verify "$E/aa-$suite" > /dev/null
          done
          python3 tests/e2eperf/verify.py --root "$E" --campaign paired=worker-baseline,worker-candidate --campaign aa-before=worker-candidate,worker-candidate --campaign aa-after=worker-candidate,worker-candidate > "$RUNNER_TEMP/offset-verified.json"
          cat "$RUNNER_TEMP/offset-verified.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ack-offset-ad3ce410a1c6005b581ead6c5fdf6a24e9c5d324
          path: ${{ runner.temp }}/offset-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
