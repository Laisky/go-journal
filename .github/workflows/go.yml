name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - run: go version
      - run: go mod verify
      - run: go build -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly -count=1 -timeout=180s ./...
      - run: go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s ./...
      - run: go test -mod=readonly -race -count=10 -shuffle=on -timeout=180s -run 'Test(Regression|Recovery)' ./...
      - run: git diff --exit-code -- go.mod go.sum
