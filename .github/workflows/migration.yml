name: Journal migration
on:
  push:
    branches: [fix/go127-journal-reliability]
    paths: [.github/workflows/migration.yml]
permissions:
  contents: write
jobs:
  baseline:
    if: github.repository == 'Laisky/go-journal' && github.ref == 'refs/heads/fix/go127-journal-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Establish compilable baseline without changing tested behavior
        run: |
          go mod edit -go=1.27.0
          go get github.com/json-iterator/go@v1.1.12 github.com/modern-go/reflect2@v1.0.2
          python3 - <<'PY'
          from pathlib import Path
          p = Path('legacy.go')
          s = p.read_text()
          s = s.replace('fmt.Errorf("load all ids: " + errMsg)', 'fmt.Errorf("load all ids: %s", errMsg)')
          p.write_text(s)
          PY
          gofmt -w reliability_test.go legacy.go
          go test -mod=mod -run '^$' ./...
          git config user.name 'Laisky'
          git config user.email 'public@laisky.com'
          git add go.mod go.sum reliability_test.go legacy.go
          git commit -m 'build: establish Go 1.27 journal test baseline'
          git push origin HEAD:refs/heads/fix/go127-journal-reliability
          git rev-parse HEAD
      - name: Behavioral reproductions
        run: go test -mod=readonly -count=1 -v -timeout=60s -run TestRegression ./...
      - name: Concurrent encoder and TTL reproductions
        if: always()
        run: go test -mod=readonly -race -count=5 -v -timeout=120s -run 'TestRegressionConcurrentIDEncoder|TestRegressionTTLExpiredCountConcurrent' ./...
