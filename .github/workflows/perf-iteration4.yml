name: Journal ID serialization iteration
on:
  push:
    branches: [perf/measured-journal-20260923]
    paths: [.github/workflows/perf-iteration4.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - name: Verify byte-level and partial-write contracts before optimization
        run: go test -mod=readonly -count=1 -run TestPerformanceContract ./...
      - name: Reuse encoder-locked and decoder-local eight-byte scratch words
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('serialize.go');s=p.read_text()
          s=s.replace('baseID   int64\n\twriter','baseID   int64\n\tword     [8]byte // protected by the encoder mutex\n\twriter',1)
          s=s.replace('baseID   int64\n\treader','baseID   int64\n\tword     [8]byte // decoder-local offset scratch space\n\treader',1)
          old='if err = binary.Write(enc.writer, bitOrder, offset); err != nil {'
          assert s.count(old)==1
          s=s.replace(old,'bitOrder.PutUint64(enc.word[:], uint64(offset))\n\tif _, err = enc.writer.Write(enc.word[:]); err != nil {')
          old='if err = binary.Read(dec.reader, bitOrder, &id); err == io.EOF {'
          assert s.count(old)==3
          s=s.replace(old,'if id, err = dec.readOffset(); err == io.EOF {')
          a=s.index('// LoadMaxId load the maxium')
          s=s[:a]+'''// readOffset preserves EOF versus partial-record errors without allocating a
          // temporary byte slice for every acknowledgement.
          func (dec *IdsDecoder) readOffset() (int64, error) {
          \tif _, err := io.ReadFull(dec.reader, dec.word[:]); err != nil {
          \t\treturn 0, err
          \t}
          \treturn int64(bitOrder.Uint64(dec.word[:])), nil
          }

          '''+s[a:]
          p.write_text(s)
          PY
          gofmt -w serialize.go
      - name: Verify all reliability contracts
        run: |
          go mod verify
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -count=5 -shuffle=on -timeout=180s ./...
          git diff --exit-code -- go.mod go.sum
      - name: Push the measured serialization change
        run: |
          git config user.name Laisky
          git config user.email public@laisky.com
          git add serialize.go
          git commit -m 'perf(journal): reuse fixed-width ID encoding and decoding scratch space'
          git push origin HEAD:refs/heads/perf/measured-journal-20260923
