name: Journal repair
on:
  push:
    branches: [fix/go127-journal-reliability]
    paths: [.github/workflows/journal-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'Laisky/go-journal' && github.ref == 'refs/heads/fix/go127-journal-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Correct the fixture and test the cleanup failure boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reliability_test.go');s=p.read_text()
          assert 'j := &Journal{dataEnc: enc}' in s
          s=s.replace('j := &Journal{dataEnc: enc}', 'j := &Journal{option: newOption(), dataEnc: enc}')
          s+=r'''
          func TestRegressionLegacyCleanupRequiresSuccessfulFlush(t *testing.T) {
              dir:=t.TempDir()
              old,current:=filepath.Join(dir,"old.data"),filepath.Join(dir,"current.data")
              for _,name:=range []string{old,current} {if err:=os.WriteFile(name,[]byte("retained"),0600);err!=nil{t.Fatal(err)}}
              j,err:=NewJournal();if err!=nil{t.Fatal(err)}
              j.legacy=&LegacyLoader{logger:Logger,ids:NewInt64Set(),dataFNames:[]string{old,current},dataFilesLen:1,dataFileIdx:0}
              j.dataEnc,err=NewDataEncoder(regressionReadOnlyFile(t),false);if err!=nil{t.Fatal(err)}
              if err=j.dataEnc.writer.WriteInt64(42);err!=nil{t.Fatal(err)}
              if !j.LockLegacy(){t.Fatal("cannot acquire legacy lock")}
              err=j.LoadLegacyBuf(&Data{})
              if err==nil || err==io.EOF {t.Errorf("failed durability barrier must be returned, got %v",err)}
              if _,err:=os.Stat(old);err!=nil {t.Errorf("old durable copy was deleted before replacement flush succeeded: %v",err)}
          }
          '''
          p.write_text(s)
          PY
          gofmt -w reliability_test.go
          git config user.name 'Laisky'
          git config user.email 'public@laisky.com'
          git add reliability_test.go
          git commit -m 'test: isolate flush fixture and reproduce unsafe legacy cleanup'
          git push origin HEAD:refs/heads/fix/go127-journal-reliability
          python3 - <<'PY'
          import subprocess,json
          p=subprocess.run(['go','test','-json','-mod=readonly','-count=1','-timeout=60s','-run','TestRegression','./...'],text=True,capture_output=True)
          print(p.stdout);print(p.stderr)
          events=[json.loads(x) for x in p.stdout.splitlines() if x.startswith('{')]
          failed={x.get('Test') for x in events if x.get('Action')=='fail'}
          passed={x.get('Test') for x in events if x.get('Action')=='pass'}
          required={'TestRegressionDataWritePropagatesFlushError','TestRegressionIDWritePropagatesFlushError','TestRegressionFailedIDWriteIsNotCommitted','TestRegressionJournalPropagatesDataFlushError','TestRegressionLegacyMaximumAcrossFiles','TestRegressionInt64SetCountsUniqueIDs','TestRegressionTTLCloseAfterWorkerStopped','TestRegressionJournalCloseWithoutWorkers','TestRegressionLegacyCleanupRequiresSuccessfulFlush'}
          assert required<=failed,(required-failed,failed)
          assert 'TestRegressionTTLRetainsAcknowledgementForMultipleCopies' in passed
          PY
      - name: Repair serialization, sets, lifecycle and the cleanup barrier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('serialize.go');s=p.read_text()
          assert s.count('\tenc.writer.Flush()')==2
          s=s.replace('\tenc.writer.Flush()', '\tif err = enc.writer.Flush(); err != nil { return errors.Wrap(err, "flush journal record") }')
          start=s.index('func (enc *IdsEncoder) Write(');end=s.index('// Flush flush buf to fp',start)
          part=s[start:end]
          assert part.count('\tenc.Lock()\n\tdefer enc.Unlock()')==1
          part=part.replace('\tenc.Lock()\n\tdefer enc.Unlock()\n','')
          part=part.replace('\tvar offset int64','\tenc.Lock()\n\tdefer enc.Unlock()\n\tvar offset int64')
          s=s[:start]+part+s[end:];p.write_text(s)
          p=Path('set.go');s=p.read_text()
          s=s.replace('atomic.AddInt64(&s.n, 1)\n\ts.d.Store(i, s.padding)', 'if _, loaded := s.d.LoadOrStore(i, s.padding); !loaded { atomic.AddInt64(&s.n, 1) }')
          s=s.replace('if _, ok = s.d.Load(i); ok {','if _, ok = s.d.LoadAndDelete(i); ok {').replace('\n\ts.d.Delete(i)','')
          s=s.replace('stopChan chan struct{}','stopChan chan struct{}\n\tstopOnce sync.Once')
          s=s.replace('s.og.Delete(id)\n\t\t\tatomic.AddInt64(&s.ogN, -1)', 'if _, removed := s.og.LoadAndDelete(id); removed { atomic.AddInt64(&s.ogN, -1) }')
          s=s.replace('s.stopChan <- struct{}{}','s.stopOnce.Do(func(){ close(s.stopChan) })')
          start=s.index('func (s *Int64SetWithTTL) StartRotate(')
          s=s[:start]+'''func (s *Int64SetWithTTL) StartRotate(ctx context.Context) {
              defer Logger.Info("StartRotate exit")
              ticker := time.NewTicker(s.ttl)
              defer ticker.Stop()
              for {
                  select {
                  case <-s.stopChan: return
                  case <-ctx.Done(): return
                  case <-ticker.C:
                      s.Lock()
                      s.ogN, s.ngN = s.ngN, 0
                      s.og = s.ng
                      s.ng = &sync.Map{}
                      s.Unlock()
                  }
              }
          }
          '''
          # Constructors must never create a busy loop or panic in the background.
          needle='func NewInt64SetWithTTL(ctx context.Context, ttl time.Duration) *Int64SetWithTTL {'
          s=s.replace(needle,needle+'\n\tif ttl <= 0 { ttl = defaultIDSetTTL }')
          p.write_text(s)
          p=Path('legacy.go');s=p.read_text();assert s.count('return id, nil')==1;s=s.replace('return id, nil','return maxId, nil');p.write_text(s)
          p=Path('journal.go');s=p.read_text()
          s=s.replace('stopChan               chan struct{}', 'stopChan               chan struct{}\n\tcloseOnce sync.Once\n\tlifecycleMu sync.Mutex\n\tworkers sync.WaitGroup\n\tstarted bool')
          assert 'lifecycleMu' in s
          needle='func (j *Journal) Start(ctx context.Context) (err error) {'
          s=s.replace(needle,needle+'''
              j.lifecycleMu.Lock()
              defer j.lifecycleMu.Unlock()
              select { case <-j.stopChan: return os.ErrClosed; default: }
              if j.started { return nil }
          ''')
          s=s.replace('go j.startFlushTrigger(ctx)\n\tgo j.startRotateTrigger(ctx)', '''j.started = true
              j.workers.Add(2)
              go func(){ defer j.workers.Done(); j.startFlushTrigger(ctx) }()
              go func(){ defer j.workers.Done(); j.startRotateTrigger(ctx) }()''')
          start=s.index('func (j *Journal) Close()');end=s.index('// initBufDir',start)
          s=s[:start]+'''// Close broadcasts shutdown, waits for both workers, and is idempotent.
          func (j *Journal) Close() {
              j.closeOnce.Do(func(){
                  j.lifecycleMu.Lock()
                  close(j.stopChan)
                  j.lifecycleMu.Unlock()
                  j.workers.Wait()
                  j.Lock()
                  defer j.Unlock()
                  if err := j.Flush(); err != nil { j.logger.Error("flush closing journal", zap.Error(err)) }
                  if j.dataFp != nil { j.dataFp.Close(); j.dataFp = nil }
                  if j.idsFp != nil { j.idsFp.Close(); j.idsFp = nil }
                  j.dataEnc, j.idsEnc = nil, nil
                  if j.legacy != nil {
                      if closer, ok := j.legacy.ids.(interface{Close()}); ok { closer.Close() }
                  }
              })
          }

          '''+s[end:]
          s=s.replace('errors.Wrap(err, "flush data encoder")','errors.Wrap(dataErr, "flush data encoder")')
          # Both replaced sites declare dataErr in their enclosing if.
          s=s.replace('defer j.Flush()', 'defer func(){ j.Lock(); defer j.Unlock(); j.Flush() }()')
          old='j.legacy.AddID(id)\n\treturn j.idsEnc.Write(id)'
          assert old in s
          s=s.replace(old,'if err := j.idsEnc.Write(id); err != nil { return err }\n\tj.legacy.AddID(id)\n\treturn nil')
          for name in ['WriteData','WriteId']:
              start=s.index('func (j *Journal) '+name+'(');end=s.index('\n}',start)
              part=s[start:end]
              part=part.replace('defer j.RUnlock()', 'defer j.RUnlock()\n\tselect { case <-j.stopChan: return os.ErrClosed; default: }')
              s=s[:start]+part+s[end:]
          # A rotated replacement must also reach disk before its predecessor is reclaimed.
          old='if err = j.flushAndClose(); err != nil {'
          assert s.count(old)==1
          s=s.replace(old,'if err = j.syncLocked(); err != nil { return errors.Wrap(err, "sync journal before rotation") }\n\t'+old)
          start=s.index('func (j *Journal) LoadLegacyBuf(')
          part=s[start:]
          part=part.replace('j.RLock()\n\tdefer j.RUnlock()', 'j.Lock()\n\tdefer j.Unlock()')
          old='if err = j.legacy.Clean(); err != nil {'
          assert old in part
          part=part.replace(old,'if err = j.syncLocked(); err != nil { j.UnLockLegacy(); return errors.Wrap(err, "sync replay before cleanup") }\n\t\t'+old)
          s=s[:start]+part
          s+='''
          // Sync makes completed writes durable. It does not wait for work queued in
          // another goroutine: replay callers must WriteData before requesting cleanup.
          func (j *Journal) Sync() error {
              j.Lock()
              defer j.Unlock()
              select { case <-j.stopChan: return os.ErrClosed; default: }
              return j.syncLocked()
          }
          func (j *Journal) syncLocked() error {
              if err := j.Flush(); err != nil { return err }
              for _, fp := range []*os.File{j.dataFp, j.idsFp} {
                  if fp != nil { if err := fp.Sync(); err != nil { return errors.Wrap(err, "sync journal file") } }
              }
              if j.dataFp != nil || j.idsFp != nil {
                  dir, err := os.Open(j.bufDirPath)
                  if err != nil { return errors.Wrap(err, "open journal directory for sync") }
                  defer dir.Close()
                  if err := dir.Sync(); err != nil { return errors.Wrap(err, "sync journal directory") }
              }
              return nil
          }
          '''
          p.write_text(s)
          PY
          gofmt -w serialize.go set.go legacy.go journal.go
          go test -mod=readonly -count=1 -v -timeout=120s -run TestRegression ./...
          go test -mod=readonly -race -count=10 -timeout=180s -run TestRegression ./...
          git add serialize.go set.go legacy.go journal.go
          git diff --cached --check
          git commit -m 'fix: preserve journal errors, serialize acknowledgements and gate reclamation'
          git push origin HEAD:refs/heads/fix/go127-journal-reliability
          git rev-parse HEAD
      - name: Full journal verification
        run: |
          go test -mod=readonly -count=1 -timeout=180s ./...
          go test -mod=readonly -race -count=1 -timeout=180s ./...
          go vet -mod=readonly ./...
          go build -mod=readonly ./...
